specVersion: 1.0.0
description: Siphon vault anonymity set + deposits + swaps on Base
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: MerkleTreeBaseEth
    network: base
    source:
      address: "0x9b71269665f38A63C76a99A2966AbC9a25c41741"
      abi: MerkleTree
      startBlock: 48026000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MerkleLeaf
        - AnonymitySet
        - MerkleTree
      abis:
        - name: MerkleTree
          file: ./abis/MerkleTree.json
      eventHandlers:
        - event: LeafInserted(uint256,uint256,uint256)
          handler: handleLeafInsertedBaseEth
      file: ./src/merkle.ts

  - kind: ethereum
    name: MerkleTreeBaseUsdc
    network: base
    source:
      address: "0xff5365729C2Aa9Ef6d04C0D58c5c6FD1B5aCc4e8"
      abi: MerkleTree
      startBlock: 48026000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - MerkleLeaf
        - AnonymitySet
        - MerkleTree
      abis:
        - name: MerkleTree
          file: ./abis/MerkleTree.json
      eventHandlers:
        - event: LeafInserted(uint256,uint256,uint256)
          handler: handleLeafInsertedBaseUsdc
      file: ./src/merkle.ts

  - kind: ethereum
    name: VaultBaseEth
    network: base
    source:
      address: "0x6a6391854c078Ad1C365d66ca078461acc02B201"
      abi: Vault
      startBlock: 48026000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Deposit
        - VaultSwap
        - AnonymitySet
        - Vault
      abis:
        - name: Vault
          file: ./abis/Vault.json
      eventHandlers:
        - event: Deposited(indexed address,uint256,uint256,uint256)
          handler: handleDepositedBaseEth
        - event: Swapped(indexed address,(address,address,address,address,uint256,uint256,uint24,uint256),uint256,uint256)
          handler: handleSwappedBaseEth
      file: ./src/vault.ts

  - kind: ethereum
    name: VaultBaseUsdc
    network: base
    source:
      address: "0xb5187De5f97753c75B0c70e69cDAA0b246ea6FD9"
      abi: Vault
      startBlock: 48026000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Deposit
        - VaultSwap
        - AnonymitySet
        - Vault
      abis:
        - name: Vault
          file: ./abis/Vault.json
      eventHandlers:
        - event: Deposited(indexed address,uint256,uint256,uint256)
          handler: handleDepositedBaseUsdc
        - event: Swapped(indexed address,(address,address,address,address,uint256,uint256,uint24,uint256),uint256,uint256)
          handler: handleSwappedBaseUsdc
      file: ./src/vault.ts
