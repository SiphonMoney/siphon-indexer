"""Siphon vault + merkle anonymity set for agent / MCP live context."""

enum AssetSymbol {
  ETH
  USDC
}

type Vault @entity(immutable: true) {
  id: ID!
  chainId: Int!
  asset: AssetSymbol!
  address: Bytes!
}

type MerkleTree @entity(immutable: true) {
  id: ID!
  chainId: Int!
  asset: AssetSymbol!
  address: Bytes!
}

"""One commitment leaf — anonymity-set size = count of these per chain+asset."""
type MerkleLeaf @entity(immutable: true) {
  id: ID!
  chainId: Int!
  asset: AssetSymbol!
  merkleTree: MerkleTree!
  leafIndex: BigInt!
  leaf: BigInt!
  root: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  txHash: Bytes!
}

type Deposit @entity(immutable: true) {
  id: ID!
  chainId: Int!
  asset: AssetSymbol!
  vault: Vault!
  depositor: Bytes!
  amount: BigInt!
  commitment: BigInt!
  precommitment: BigInt!
  label: BigInt!
  nonce: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  txHash: Bytes!
}

"""Vault.swap (legacy executor path) or future atomic settle correlation."""
type VaultSwap @entity(immutable: true) {
  id: ID!
  chainId: Int!
  asset: AssetSymbol!
  vault: Vault!
  recipient: Bytes!
  pool: Bytes!
  srcToken: Bytes!
  dstToken: Bytes!
  amountIn: BigInt!
  minAmountOut: BigInt!
  fee: BigInt!
  spentNullifier: BigInt!
  newCommitment: BigInt!
  newLabel: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  txHash: Bytes!
}

"""Rolling counters for agent prompts (updated in mappings)."""
type AnonymitySet @entity(immutable: false) {
  id: ID!
  chainId: Int!
  asset: AssetSymbol!
  leafCount: BigInt!
  depositCount: BigInt!
  swapCount: BigInt!
  lastLeafAt: BigInt
  lastDepositAt: BigInt
  lastSwapAt: BigInt
}
